<!-- Guest hotspot live status page (served while logged in).
     Upload to: /hotspot-guest/status.html -->
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#43160D">
<meta http-equiv="refresh" content="$(refresh-timeout)">
<title>Status Koneksi · Gading Counseling &amp; Empowerment Center</title>
<style>
/*__TAILWIND_CSS__*/
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 py-7 text-maroon-deep antialiased">

  <main class="w-full max-w-[430px] bg-white border border-cream-line rounded-card shadow-card text-center px-8 pt-9 pb-7">
    <img class="block mx-auto mb-5 w-full max-w-[220px] h-auto"
         src="data:image/png;base64,/*__LOGO_B64__*/"
         alt="Gading Counseling &amp; Empowerment Center">

    <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-full bg-green-100">
      <svg class="h-6 w-6 text-green-700" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>

    <h2 class="font-display text-xl font-bold text-maroon mb-1">Anda Terhubung</h2>
    <p class="text-[13px] leading-relaxed text-muted mb-5">Wi-Fi Tamu &middot; sesi berakhir dalam <span class="font-semibold text-maroon">$(session-time-left)</span></p>

    <div class="mb-4 rounded-2xl border border-cream-line bg-cream-soft px-4 py-3 text-left text-xs leading-relaxed text-muted">
      <div class="flex justify-between py-[3px]"><span>Perangkat</span><span class="font-semibold text-maroon-deep">$(username)</span></div>
      <div class="flex justify-between py-[3px]"><span>Alamat IP</span><span class="font-semibold text-maroon-deep">$(ip)</span></div>
      <div class="flex justify-between py-[3px]"><span>Terhubung</span><span class="font-semibold text-maroon-deep">$(uptime)</span></div>
      <div class="flex justify-between py-[3px]"><span>Unduh / Unggah</span><span class="font-semibold text-maroon-deep">$(bytes-in-nice) / $(bytes-out-nice)</span></div>
    </div>

    <div class="mb-5 h-1.5 w-full overflow-hidden rounded-full bg-cream-line">
      <div class="h-full w-2/3 rounded-full bg-gold"></div>
    </div>

    <a class="block w-full rounded-2xl border-2 border-maroon py-3.5 px-4 text-[14px] font-bold text-maroon no-underline active:translate-y-px"
       href="$(link-logout)">
      Putuskan Koneksi
    </a>

    <p class="mt-4 text-[10.5px] leading-relaxed text-[#954638]">Halaman ini menyegarkan otomatis.</p>
  </main>

</body>
</html>
