<!--
  MikroTik staff hotspot login page.

  Upload to: /hotspot/login.html  (i.e. the html-directory of hotspot1)
  Winbox -> Files -> drag this file into the "hotspot" folder, overwriting.

  The router expands $(ip) $(mac) $(link-orig-esc) $(hostname) per client.
  Do NOT pre-expand them and do NOT edit the file on the router.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menghubungkan…</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#43160D;
       background:radial-gradient(900px 400px at 20% -10%,rgba(244,211,13,.22),transparent 60%),#FDFBF7;
       padding:24px;text-align:center}
  .box{max-width:320px}
  .dot{width:34px;height:34px;margin:0 auto 14px;border-radius:50%;
       border:3px solid rgba(67,22,13,.15);border-top-color:#F4D30D;
       animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  p{font-size:13.5px;line-height:1.6;color:#7D3830;margin:0}
</style>
<meta http-equiv="refresh" content="0; url=https://wifi.gadingkonseling.org/hotspot?ip=$(ip)&amp;mac=$(mac)&amp;orig=$(link-orig-esc)&amp;hs=$(hostname)">
</head>
<body>
  <div class="box">
    <div class="dot" aria-hidden="true"></div>
    <p>Mengalihkan ke halaman masuk&hellip;</p>
    <p style="margin-top:10px;font-size:12px">
      <a href="https://wifi.gadingkonseling.org/hotspot?ip=$(ip)&amp;mac=$(mac)&amp;orig=$(link-orig-esc)&amp;hs=$(hostname)"
         style="color:#954638">Klik di sini jika tidak berpindah otomatis</a>
    </p>
  </div>
</body>
</html>
