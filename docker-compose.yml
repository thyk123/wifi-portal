services:
  wifi-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: wifi-portal:latest
    container_name: wifi-portal
    restart: unless-stopped
    ports:
      - "8585:8585"
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "8585"
      SSO_URL: ${SSO_URL}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET}
      PORTAL_URL: ${PORTAL_URL}
      ROUTER_URL: ${ROUTER_URL}
      ROUTER_USER: ${ROUTER_USER}
      ROUTER_PASS: ${ROUTER_PASS}
      STAFF_PREFIX: ${STAFF_PREFIX:-10.77.10.}
      STAFF_GW: ${STAFF_GW:-10.77.10.1}
      STAFF_HOTSPOT: ${STAFF_HOTSPOT:-hs-staff}
      STAFF_LOGIN_URL: ${STAFF_LOGIN_URL:-http://10.77.10.1/login}
      STAFF_LOGIN_MODE: ${STAFF_LOGIN_MODE:-get}
      CHAP_BRIDGE_URL: ${CHAP_BRIDGE_URL:-http://10.77.10.1/bridge.html}
      BRAND_NAME: ${BRAND_NAME:-Gading Counseling & Empowerment Center}
      LOGO_URL: ${LOGO_URL:-}
      SUPPORT_URL: ${SUPPORT_URL:-https://gadingkonseling.org}
      TERMS_URL: ${TERMS_URL:-https://gadingkonseling.org/kebijakan-privasi}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8585/health').read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Join Caddy's network so it can proxy by container name.
    # Rootless podman containers cannot reach host-published ports, so
    # reverse_proxy must point at wifi-portal:8585, never at a host IP.
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy-cloudflare_default}
